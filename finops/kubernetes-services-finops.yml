meters:
  - name: load_balancer_hours
    unit: instance-hour
    aggregation: sum
    dimensions:
      - cluster
      - cloud_provider
      - lb_type
  - name: public_ip_count
    unit: ip
    aggregation: max
    dimensions:
      - service
      - region
  - name: cross_zone_egress
    unit: GB
    aggregation: sum
    dimensions:
      - service
      - source_zone
      - destination_zone
  - name: data_processed
    unit: GB
    aggregation: sum
    dimensions:
      - service
      - lb_type
  - name: endpoint_count
    unit: endpoint
    aggregation: max
    dimensions:
      - service
principles:
  - name: Visibility
    description: Use OpenCost / Kubecost network attribution and cloud-provider LB tags to surface per-Service
      cloud spend; correlate Service annotations with FOCUS BilledCost from the cloud invoice.
  - name: Allocation
    description: Tag Services with team/product/environment labels; ensure cloud-provider Cloud Controller
      Manager (CCM) propagates those labels to LB resources so the bill carries the same allocation dimensions.
  - name: Optimization
    description: Consolidate small per-app LBs behind shared Ingress / Gateway API; use ClusterIP + Ingress
      instead of one LoadBalancer Service per app; enable topology-aware routing to keep traffic in-zone
      and reduce egress; consider internal LBs where external exposure is unnecessary.
  - name: Accountability
    description: Platform team owns the shared Ingress / Gateway and the CCM configuration; product teams
      own the Services they create. Review LB sprawl monthly; deprecate Services without active endpoints.
