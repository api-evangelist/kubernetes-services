description: 'FOCUS-aligned FinOps for the Kubernetes Services API: the abstraction itself is free open
  source, but real spend appears on the cloud-provider invoice when Services of type LoadBalancer provision
  cloud LBs, when NodePort/ClusterIP traffic crosses zones, or when external IPs and egress are billed.
  FinOps signal therefore comes from the underlying cloud bill, allocated back to Services via labels
  and CCM annotations.'
sources:
