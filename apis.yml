aid: kubernetes-services
name: Kubernetes Services
description: >-
  Kubernetes Services provide an abstract way to expose an application running
  on a set of Pods as a network service. They provide stable networking
  endpoints and load balancing across pod replicas in a Kubernetes cluster.
