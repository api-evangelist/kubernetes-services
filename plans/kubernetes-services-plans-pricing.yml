description: The Kubernetes Services API (ClusterIP, NodePort, LoadBalancer, ExternalName, Headless,
  Gateway API) is a core part of the Kubernetes project — Apache-2.0 licensed and free to use. There
  is no vendor charge for the Service abstraction itself. Costs accrue from the underlying cloud-provider
  load balancers (NLB, ALB, GCLB, Azure LB), public IPs, and inter-zone/egress data transfer that LoadBalancer-typed
  Services may provision.
